openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8083
  description: Generated server url
tags:
- name: Society Registration APIs
  description: Manages the lifecycle and operations of housing societies within the
    Township platform. This includes registration of new societies with comprehensive
    validation and retrieval of society details.
paths:
  /api/v1/societies/{societyId}:
    get:
      tags:
      - Society Registration APIs
      summary: Fetch society by ID
      description: "Retrieves the details of a specific society based on the provided\
        \ Society ID (UUID). Returns the full society profile including address, timestamps,\
        \ and status."
      operationId: getSocietyById
      parameters:
      - name: societyId
        in: path
        description: Unique ID of the organization to be find
        required: true
        schema:
          type: string
          format: uuid
        example: 5d124154-24d0-4783-adda-aa0c0362a45b
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoreResponseSociety"
    put:
      tags:
      - Society Registration APIs
      summary: Update an existing society
      description: |-
        Updates an existing housing society. This operation requires a fully populated request body containing the society's name, address details (including city, state, country, pincode), and the creator's user ID.

        **Validation Rules:**
        <ul>
          <li><b>Name:</b> Required, max 255 characters.</li>
          <li><b>Address:</b> Required, max 500 characters.</li>
          <li><b>Pincode:</b> Required, numeric format (4-10 digits).</li>
          <li><b>CreatedByUserId:</b> Required UUID.</li>
        </ul>

        Returns the updated society object.
      operationId: updateSociety
      parameters:
      - name: societyId
        in: path
        description: Unique ID of the organization to be updated
        required: true
        schema:
          type: string
          format: uuid
        example: 5d124154-24d0-4783-adda-aa0c0362a45b
      requestBody:
        description: Payload to update a society
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TownSocietyRequest"
            examples:
              FullValidRequest:
                $ref: component/examples/society_process_requests.yaml#/components/examples/FullValidRequest
              MinimalValidRequest:
                $ref: component/examples/society_process_requests.yaml#/components/examples/MinimalValidRequest
              InvalidPincodeFormat:
                $ref: component/examples/society_process_requests.yaml#/components/examples/InvalidPincodeFormat
              InvalidPincodeLength:
                $ref: component/examples/society_process_requests.yaml#/components/examples/InvalidPincodeLength
              InvalidMissingRequired:
                $ref: component/examples/society_process_requests.yaml#/components/examples/InvalidMissingRequired
              InvalidNameTooLong:
                $ref: component/examples/society_process_requests.yaml#/components/examples/InvalidNameTooLong
              InvalidEmptyStrings:
                $ref: component/examples/society_process_requests.yaml#/components/examples/InvalidEmptyStrings
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoreResponse"
              examples:
                SocietyRegistrationSuccess:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyRegistrationSuccess
                SocietyCountryRequired:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyCountryRequired
                SocietyStateRequired:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyStateRequired
                SocietyCityRequired:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyCityRequired
                SocietyAddressRequired:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyAddressRequired
                SocietyAddressMaxLength:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyAddressMaxLength
                SocietyPincodeMissing:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyPincodeMissing
                SocietyPincodeInvalidFormat:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyPincodeInvalidFormat
                SocietyCreatedByRequired:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyCreatedByRequired
  /api/v1/societies:
    get:
      tags:
      - Society Registration APIs
      summary: Fetch all societies
      description: Retrieves a list of all registered housing societies.
      operationId: getAllSocieties
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoreResponseListSociety"
    post:
      tags:
      - Society Registration APIs
      summary: Register a new society
      description: |-
        Registers a new housing society. This operation requires a fully populated request body containing the society's name, address details (including city, state, country, pincode), and the creator's user ID.

        **Validation Rules:**
        <ul>
          <li><b>Name:</b> Required, max 255 characters.</li>
          <li><b>Address:</b> Required, max 500 characters.</li>
          <li><b>Pincode:</b> Required, numeric format (4-10 digits).</li>
          <li><b>CreatedByUserId:</b> Required UUID.</li>
        </ul>

        Returns the created society object with a generated UUID and status set to ACTIVE.
      operationId: registerSociety
      requestBody:
        description: Payload to register a new society
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TownSocietyRequest"
            examples:
              FullValidRequest:
                $ref: component/examples/society_process_requests.yaml#/components/examples/FullValidRequest
              MinimalValidRequest:
                $ref: component/examples/society_process_requests.yaml#/components/examples/MinimalValidRequest
              InvalidPincodeFormat:
                $ref: component/examples/society_process_requests.yaml#/components/examples/InvalidPincodeFormat
              InvalidPincodeLength:
                $ref: component/examples/society_process_requests.yaml#/components/examples/InvalidPincodeLength
              InvalidMissingRequired:
                $ref: component/examples/society_process_requests.yaml#/components/examples/InvalidMissingRequired
              InvalidNameTooLong:
                $ref: component/examples/society_process_requests.yaml#/components/examples/InvalidNameTooLong
              InvalidEmptyStrings:
                $ref: component/examples/society_process_requests.yaml#/components/examples/InvalidEmptyStrings
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoreResponse"
              examples:
                SocietyRegistrationSuccess:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyRegistrationSuccess
                SocietyCountryRequired:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyCountryRequired
                SocietyStateRequired:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyStateRequired
                SocietyCityRequired:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyCityRequired
                SocietyAddressRequired:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyAddressRequired
                SocietyAddressMaxLength:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyAddressMaxLength
                SocietyPincodeMissing:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyPincodeMissing
                SocietyPincodeInvalidFormat:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyPincodeInvalidFormat
                SocietyCreatedByRequired:
                  $ref: component/examples/society_process_response.yaml#/components/examples/SocietyCreatedByRequired
components:
  schemas:
    TownSocietyRequest:
      required:
      - address
      - city
      - country
      - createdByUserId
      - name
      - pincode
      - state
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 0
          type: string
          description: Name of the society
          example: Greenwood Park Residences
        country:
          type: string
          description: Country where the society is located
          example: USA
        state:
          type: string
          description: State where the society is located
          example: California
        city:
          type: string
          description: City where the society is located
          example: San Francisco
        address:
          maxLength: 500
          minLength: 0
          type: string
          description: Detailed address line
          example: "123 Innovation Drive, Suite 100"
        pincode:
          pattern: "^[0-9]{4,10}$"
          type: string
          description: Postal code
          example: "94105"
        landmark:
          type: string
          description: Nearby landmark
          example: Near the Bay Bridge
        createdByUserId:
          type: string
          description: UUID of the user creating the society
          example: a9b8c7d6-e5f4-g3h2-i1j0-k9l8m7n6o5p4
      description: Request payload for registering a new society.
    CoreMessage:
      type: object
      properties:
        type:
          type: string
        code:
          type: string
    CoreMeta:
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: string
    CoreResponse:
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/CoreMeta"
        data:
          type: object
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CoreMessage"
    CoreResponseSociety:
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/CoreMeta"
        data:
          $ref: "#/components/schemas/Society"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CoreMessage"
    Society:
      type: object
      properties:
        societyId:
          type: string
        name:
          type: string
        country:
          type: string
        state:
          type: string
        city:
          type: string
        address:
          type: string
        pincode:
          type: string
        landmark:
          type: string
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - draft
          - active
          - suspended
        id:
          type: string
    CoreResponseListSociety:
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/CoreMeta"
        data:
          type: array
          items:
            $ref: "#/components/schemas/Society"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CoreMessage"
