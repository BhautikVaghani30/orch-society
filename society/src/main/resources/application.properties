spring.application.name=society

spring.profiles.group.default=application-pooling
spring.profiles.active=default

orch.checkout.contentType=application/json
orch.checkout.accept=application/json

# Flag to enable or disable the auditing of error messages.
# This property is required by the CoreAuditService in the common library.
core.audit.error.messages=true

logging.level.root=INFO
logging.level.com.core.township=DEBUG
logging.level.org.springframework.web=DEBUG